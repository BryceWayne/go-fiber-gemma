name: CI

on:
  push:
    branches: [ "root", "feature/*" ]
  pull_request:
    branches: [ "root" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: go mod tidy

    - name: Run go vet
      run: go vet ./...

    - name: Run tests with race detector
      run: go test -v -race ./...
